<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Bean</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  </head>

  <body>

<nav>
  <a href="index.html" class="nav-logo">
    <img src="images/logo.png" alt="Vanilla Bean">
  </a>
  <ul>
    <li><a href="index.html">Our Cakes</a></li>
    <li><a href="order.html">Place an Order</a></li>
  </ul>
</nav>

    <section class="hero">
      <h1>Happiness Made Edible</h1>
      <p>Customised celebration cakes crafted with love in Chicago</p>
      <a href="order.html" class="btn">Order Yours</a>
    </section>

    <section class="catalogue">
      <h2>Our Cakes</h2>
      <p class="subtitle">Every cake is made to order, just for you</p>
      <div class="cake-grid" id="cake-grid">
        <!-- Cakes will appear here -->
      </div>
      </section>

    <div id="lightbox" class="lightbox">
      <div class="lightbox-content">

        <div class="lightbox-header">
          <h2 id="lightbox-title"></h2>
          <p id="lightbox-description"></p>
        </div>

        <div class="lightbox-gallery">
          <img id="lightbox-left" class="lightbox-side" alt="cake angle">
          <img id="lightbox-main" class="lightbox-main-img" alt="cake main">
          <img id="lightbox-right" class="lightbox-side" alt="cake angle">
        </div>

        <button class="lightbox-close" onclick="closeLightbox()">✕</button>

      </div>
    </div>

    <script src="script.js"></script>

  </body>
</html>
